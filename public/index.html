<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVRAPPEL V7.6.5</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50"><div class="max-w-lg mx-auto p-4"><h1 class="text-3xl font-black mt-4">LIVRAPPEL<span class="text-green-500"> V7.6.5</span></h1><p id="cfg" class="text-xs text-gray-400 mt-1">Loading config...</p><div class="bg-white rounded-2xl shadow p-6 mt-6 space-y-3"><input id="client_name" placeholder="Nom client" class="w-full border p-3 rounded-xl"><input id="client_phone" placeholder="Tel client 6XXXXXXXX" class="w-full border p-3 rounded-xl"><input id="address" placeholder="Adresse" class="w-full border p-3 rounded-xl"><input id="zone" value="Akwa" class="w-full border p-3 rounded-xl"><input id="amount" type="number" value="2000" class="w-full border p-3 rounded-xl"><input id="rider_phone" placeholder="Tel livreur 6XXXXXXXX" class="w-full border p-3 rounded-xl"><button onclick="create()" id="btn" class="w-full bg-black text-white py-4 rounded-xl font-bold">CRÉER COMMANDE</button><div id="result" class="hidden mt-6 space-y-3"></div></div><div class="text-center mt-6"><a href="/admin" class="text-blue-600 underline mr-4">Admin</a><a href="/rider" class="text-green-600 underline">Rider</a></div></div><script>fetch('/api/config').then(r=>r.json()).then(c=>{cfg.innerText=Merchant:${c.merchant_id} | URL:${c.public_url} | HASH_KEY:${c.hash_key_set?'OK':'MISSING'}});async function create(){btn.innerText='...';let d={client_name:client_name.value,client_phone:client_phone.value,address:address.value,zone:zone.value,amount:amount.value,rider_phone:rider_phone.value};let r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();result.classList.remove('hidden');result.innerHTML=<div class='bg-green-50 p-4 rounded-xl border'><b>${j.orderId}</b><br>HASH:${j.hashki}<br>Toi 10%:${j.gain_app} | Rider 90%:${j.gain_livreur}</div><a href='${j.whatsapp_client}' target='_blank' class='w-full bg-green-500 text-white py-3 rounded-xl block text-center font-bold'>📲 WhatsApp CLIENT</a><a href='${j.whatsapp_rider}' target='_blank' class='w-full bg-blue-600 text-white py-3 rounded-xl block text-center font-bold'>🏍️ WhatsApp LIVREUR</a><a href='${j.pay_link}' class='w-full bg-orange-500 text-white py-3 rounded-xl block text-center font-bold'>💳 PAY LINK</a>;btn.innerText='CRÉÉ ✅';window.open(j.whatsapp_client,'_blank');}</script></body></html>
