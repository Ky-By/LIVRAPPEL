<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider V7.6.5</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50"><div class="max-w-lg mx-auto p-4"><h1 class="text-2xl font-black mt-4">Espace Livreur</h1><div class="bg-white p-6 rounded-2xl mt-6"><input id="orderId" placeholder="LIV-XXXXXX" class="w-full border p-3 rounded-xl"><button onclick="check()" class="w-full bg-black text-white py-3 rounded-xl mt-3">VÉRIFIER</button><div id="result" class="hidden mt-4 p-4 bg-gray-100 rounded-xl text-sm"></div></div></div><script>const p=new URLSearchParams(location.search).get('order');if(p)orderId.value=p;async function check(){let r=await fetch(/api/order/${orderId.value});let d=await r.json();result.classList.remove('hidden');result.innerHTML=${d.orderId}<br>${d.client_name} ${d.client_phone}<br>${d.address} ${d.zone}<br>${d.amount} XAF | Gain:${d.gain_livreur} XAF | Payout:${d.payout_status}<br>Paiement:${d.paiement_statut}<br>HASH:${d.hashki}<br><a href='/validate/${d.orderId}?hash=${d.hashki}' class='bg-green-600 text-white px-4 py-2 rounded-xl inline-block mt-2'>Valider</a>;}</script></body></html>
