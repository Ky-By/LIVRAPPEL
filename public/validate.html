<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payer V7.6.5</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50"><div class="max-w-md mx-auto p-4"><div class="text-center mt-6"><h1 class="text-2xl font-black">LIVRAPPEL<span class="text-green-500"> PAY</span></h1></div><div id="orderCard" class="bg-white rounded-2xl shadow p-6 mt-6">Chargement...</div><div class="bg-white rounded-2xl shadow p-6 mt-4"><p id="amount" class="text-3xl font-black text-orange-600">0 XAF</p><p id="split" class="text-xs text-gray-500"></p><button id="payBtn" onclick="payNow()" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white py-4 rounded-xl font-black mt-4">PAYER MAINTENANT</button><div id="payStatus" class="hidden mt-4 p-3 rounded-xl text-sm text-center"></div></div><div class="bg-white rounded-2xl shadow p-6 mt-4"><h2 class="font-bold">Validation livraison</h2><input id="hashInput" placeholder="Entrez HASH KEY" class="w-full border-2 p-3 rounded-xl mt-4 font-mono text-center tracking-widest"><button onclick="validate()" class="w-full bg-black text-white py-4 rounded-xl font-bold mt-3">VALIDER LIVRAISON</button><p id="validateMsg" class="mt-3 text-center font-bold"></p></div></div><script>const orderId=location.pathname.split('/').pop().split('?')[0];const hashParam=new URLSearchParams(location.search).get('hash');async function load(){let r=await fetch(/api/order/${orderId});let o=await r.json();if(!o.orderId){orderCard.innerHTML='Not found';return;}orderCard.innerHTML=<div class="flex justify-between"><div><p class="font-black">${o.orderId}</p><p class="text-sm">${o.client_name} - ${o.client_phone}</p><p class="text-sm">${o.address}, ${o.zone}</p></div><span class="${o.paiement_statut==='Payé'?'bg-green-500':'bg-red-500'} text-white px-3 py-1 rounded-full text-xs">${o.paiement_statut}</span></div><div class="grid grid-cols-2 gap-2 mt-4 text-xs"><div class="bg-gray-100 p-2 rounded">Toi 10%: <b>${o.gain_app}</b></div><div class="bg-green-50 p-2 rounded">Rider 90%: <b>${o.gain_livreur}</b> Payout:${o.payout_status}</div></div>;amount.innerText=o.amount+' XAF';split.innerText=Split auto: Admin 10%=${o.gain_app} | Rider 90%=${o.gain_livreur};if(o.paiement_statut==='Payé'){payBtn.innerText='✅ DÉJÀ PAYÉ';payBtn.disabled=true;payStatus.classList.remove('hidden');payStatus.className='mt-4 p-3 rounded-xl bg-green-100 text-green-700 text-center';payStatus.innerText='✅ Paiement OK - Payout 90% déclenché';}if(hashParam)hashInput.value=hashParam;}async function payNow(){payBtn.innerText='Redirection...';let res=await fetch(/api/pay/${orderId},{method:'POST'});let j=await res.json();if(j.mock){payStatus.classList.remove('hidden');payStatus.className='mt-4 p-3 rounded-xl bg-yellow-100 text-center';payStatus.innerText='TEST MODE: Paiement simulé - Payout en cours';setTimeout(()=>location.reload(),1500);}else if(j.payment_url)window.location.href=j.payment_url;}async function validate(){let res=await fetch(/api/validate/${orderId},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hash:hashInput.value})});let j=await res.json();validateMsg.innerText=j.message;validateMsg.className=j.success?'text-green-600 text-center font-bold mt-3':'text-red-600 text-center font-bold mt-3';}load();</script></body></html>
