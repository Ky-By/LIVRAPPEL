<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V7.6.5</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white"><div class="max-w-7xl mx-auto p-6"><h1 class="text-3xl font-black">ADMIN<span class="text-green-500"> V7.6.5 PAYOUT</span></h1><p class="text-xs text-gray-400"><span id="mid"></span> | <span id="url"></span> | <span id="pkey"></span> | <span id="hkey"></span></p><div class="grid grid-cols-4 gap-4 mt-6"><div class="bg-gray-900 p-4 rounded-xl"><p id="total" class="text-2xl font-bold">0</p><p class="text-xs text-gray-400">Commandes</p></div><div class="bg-gray-900 p-4 rounded-xl"><p id="totalAdmin" class="text-2xl font-bold text-orange-400">0</p><p class="text-xs text-gray-400">Ton Gain 10%</p></div><div class="bg-gray-900 p-4 rounded-xl"><p id="totalPayout" class="text-2xl font-bold text-green-400">0</p><p class="text-xs text-gray-400">Payé Riders 90%</p></div><div class="bg-gray-900 p-4 rounded-xl"><p id="pending" class="text-2xl font-bold text-yellow-400">0</p><p class="text-xs text-gray-400">Pending</p><a href="/api/admin/export" class="bg-white text-black px-3 py-1 rounded mt-2 inline-block text-xs">Export CSV</a></div></div><div class="bg-white text-black rounded-xl p-4 mt-6 overflow-auto"><table class="w-full text-xs"><thead><tr class="border-b font-bold"><th>ID</th><th>Admin</th><th>Rider 90%</th><th>Phone Rider</th><th>Status</th><th>Date</th></tr></thead><tbody id="tbody"></tbody></table></div></div><script>async function load(){let r=await fetch('/api/admin/stats');let d=await r.json();total.innerText=d.total;totalAdmin.innerText=d.totalAdmin+' XAF';totalPayout.innerText=d.totalPayout+' XAF';pending.innerText=d.pendingPayouts;mid.innerText='Merchant:'+d.merchant_id;url.innerText='URL:'+d.public_url;pkey.innerText='PublicKey:'+(d.public_key?'OK':'MISSING');hkey.innerText='HASH_KEY:'+d.hash_key;tbody.innerHTML='';d.transactions.forEach(t=>{tbody.innerHTML+=<tr class='border-b'><td>${t.orderId}</td><td>${t.gain_app}</td><td class='font-bold text-green-600'>${t.gain_rider}</td><td>${t.rider_phone}</td><td><span class='${t.status==='paid_real'?'bg-green-500 text-white':'bg-yellow-400'} px-2 py-1 rounded'>${t.status}</span></td><td>${new Date(t.date).toLocaleString()}</td></tr>;});}load();setInterval(load,5000);</script></body></html>
